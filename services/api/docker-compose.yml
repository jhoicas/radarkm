services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      RADARKM_API_ADDR: ":8080"
      RADARKM_DATABASE_URL: postgres://radarkm:radarkm@postgres:5432/radarkm?sslmode=disable
      RADARKM_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radarkm
      POSTGRES_USER: radarkm
      POSTGRES_PASSWORD: radarkm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radarkm -d radarkm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
